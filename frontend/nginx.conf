server {
    listen 80;
    server_name localhost;

    # Point Nginx to Docker's internal DNS resolver and tell it to cache for only 1 mins
    resolver 127.0.0.11 valid=1m;

    # 1. Route API requests to the Go backend container
    location /api/ {
        # 1. Define the variable FIRST (before the break)
        set $api_upstream http://server-api:8080;
        
        # 2. Strip the /api/ prefix
        rewrite ^/api/(.*) /$1 break;
        
        # 3. Forward the traffic
        proxy_pass $api_upstream;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve the Vue frontend for all other requests
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # This allows Vue Router to handle the URLs without Nginx throwing a 404
        try_files $uri $uri/ /index.html;
    }
}