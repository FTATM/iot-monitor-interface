server {
    listen 80;
    server_name localhost;

    # 1. Route API requests to the Go backend container
    location /api/ {
        # 'backend' matches the service name in docker-compose.yml
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Serve the Vue frontend for all other requests
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # This allows Vue Router to handle the URLs without Nginx throwing a 404
        try_files $uri $uri/ /index.html;
    }
}